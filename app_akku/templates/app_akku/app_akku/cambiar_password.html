{% extends "app_akku/app_akku/base.html" %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <h2 class="mb-4" style="font-weight: 800; border-bottom: 2px solid #000; padding-bottom: 10px;">CAMBIAR CONTRASEÑA</h2>
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="btn btn-dark" style="border-radius: 0;">GUARDAR NUEVA CONTRASEÑA</button>
            <a href="{% url 'perfil' %}" class="btn btn-outline-secondary" style="border-radius: 0;">CANCELAR</a>
        </form>
    </div>
</div>
{% endblock %}
