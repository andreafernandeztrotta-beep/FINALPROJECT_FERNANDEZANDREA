{% extends "app_akku/app_akku/base.html" %}

{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <h2 style="font-weight: 800; border-bottom: 2px solid #000; padding-bottom: 10px;">Enviar Mensaje</h2>
            <form method="post" class="mt-4">
                {% csrf_token %}
                <div class="mb-3">
                    {{ form.as_p }}
                </div>
                <button type="submit" class="btn btn-dark w-100" style="border-radius: 0; font-weight: bold;">
                    ENVIAR AHORA
                </button>
                <a href="{% url 'mensajes' %}" class="btn btn-outline-secondary w-100 mt-2" style="border-radius: 0;">
                    Cancelar
                </a>
            </form>
        </div>
    </div>
</div>
{% endblock %}
