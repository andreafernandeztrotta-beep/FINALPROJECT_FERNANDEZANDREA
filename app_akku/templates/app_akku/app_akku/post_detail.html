{% extends "app_akku/app_akku/base.html" %}

{% block content %}
<article class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <h1 class="display-4">{{ post.titulo }}</h1>
            <p class="text-muted italic">{{ post.subtitulo }}</p>
            <hr>
            
            {% if post.imagen %}
                <img src="{{ post.imagen.url }}" class="img-fluid rounded mb-4" alt="{{ post.titulo }}">
            {% endif %}

            <div class="content-body">
                {{ post.cuerpo|safe }}
            </div>

            <hr>
            <p class="text-end"><strong>Autor:</strong> {{ post.autor }}</p>
            <p class="text-end text-muted">Publicado el: {{ post.fecha_creacion|date:"d/m/Y" }}</p>
            
            <a href="{% url 'pages' %}" class="btn btn-secondary mt-3">Volver al Portfolio</a>
        </div>
    </div>
</article>
{% endblock %}
