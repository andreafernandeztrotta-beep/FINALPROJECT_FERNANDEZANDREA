{% extends "app_akku/app_akku/base.html" %}
{% block content %}
<h2>Dejanos tu consulta</h2>
{% if enviado %}
    <div class="alert alert-success mt-3" style="border-radius: 0; border: 2px solid #000;">
        ¡Gracias! Tu consulta fue enviada y guardada correctamente. Te responderemos a la brevedad.
    </div>
{% endif %}
<form method="POST" class="mt-4">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn btn-dark">Enviar Solicitud</button>
</form>
{% endblock %}
