{% extends "app_akku/app_akku/base.html" %}
{% block content %}
<div class="container mt-5">
    <h2 style="font-weight: 800; border-bottom: 2px solid #000; padding-bottom: 10px;">EDITAR MI PERFIL</h2>
    <form method="post" class="mt-4">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-dark" style="border-radius: 0;">GUARDAR CAMBIOS</button>
        <a href="{% url 'perfil' %}" class="btn btn-outline-secondary" style="border-radius: 0;">CANCELAR</a>
    </form>
</div>
{% endblock %}
