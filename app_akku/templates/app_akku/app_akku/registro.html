{% extends "app_akku/app_akku/base.html" %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <h2 class="mb-4" style="font-weight: 800; border-bottom: 2px solid #000; padding-bottom: 10px;">CREAR CUENTA</h2>
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="btn btn-akku w-100">Registrarme</button>
        </form>
        <p class="mt-3 text-muted">¿Ya tenés cuenta? <a href="{% url 'login' %}" class="text-dark">Ingresá acá</a></p>
    </div>
</div>
{% endblock %}
